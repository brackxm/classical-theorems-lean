name: Deep proof verification
on:
  # Verify the tagged source, not just whatever is currently on master.
  push:
    tags: ['[0-9]*', 'v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deep:
    if: github.repository == 'brackxm/classical-theorems-lean'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release metadata and source integrity
        run: |
          python3 scripts/release.py --metadata-only
          python3 scripts/check_vendor.py
          python3 scripts/check_imports.py
          python3 scripts/check_comparator.py
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          df -h / /mnt || df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/share/powershell
          df -h / /mnt || df -h /
      - name: Install kernel-check sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor-profiles
          sudo mkdir -p /run/user
          sandbox_profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          if [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" == 1 && -f "$sandbox_profile" ]]; then
            sudo install -m 0644 "$sandbox_profile" /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi
          bwrap --ro-bind / / --unshare-all --proc /proc --dev /dev -- /bin/true
      - name: Cache the pinned Lean toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Build library
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          auto-config: 'false'
          build: 'true'
          build-args: '--fail-fast'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Compare all indexed theorem contracts with independent checkers
        run: lake comparator --paranoid
      - name: Replay full-library exports with independent checkers
        run: lake check --paranoid
      - name: Report disk usage
        if: always()
        run: |
          df -h / /mnt || df -h /
          du -sh .lake vendor/*/.lake "$HOME/.elan" 2>/dev/null || true
