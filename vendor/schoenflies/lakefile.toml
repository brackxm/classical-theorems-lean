# Updated for Lean 4.35.0 on 2026-10-22.
name = "schoenflies-lean"
version = "0.1.0"
defaultTargets = ["Schoenflies"]
# Preserve the existing public API while using module-system dependencies.
allowNonModules = true

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "Schoenflies"
