name = "classical_theorems"
version = "0.0.2"
defaultTargets = ["ClassicalTheorems"]
# Preserve the existing public API while using module-system dependencies.
allowNonModules = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[require]]
name = "Foundation"
path = "vendor/foundation"

[[require]]
name = "unico-lean-proofs"
path = "vendor/unico"

[[require]]
name = "MovingSofa"
path = "vendor/moving-sofa"

[[require]]
name = "jordan_pick"
path = "vendor/jordan-pick"

[[require]]
name = "schoenflies-lean"
path = "vendor/schoenflies"

[[lean_lib]]
name = "ClassicalTheorems"

[[require]]
name = "HOLLightPort"
path = "vendor/hol-light-port"
